<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Danilo Fiocco · Games</title>
  <style>
    :root { color-scheme: light dark; --bg: #f4f7fb; --fg: #1d2733; --muted: #5a6878; --card: #fff; --line: #dce3ec; --link: #0a66c2; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1520; --fg: #e6edf5; --muted: #9aa8b8; --card: #152131; --line: #24344a; --link: #6cb4ff; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 24px; font-size: 28px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; }
    h2 { margin: 0 0 6px; font-size: 20px; }
    p { margin: 6px 0; color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
<main>
  <h1>Games by Danilo Fiocco</h1>
  <div class="card">
    <h2>Bow Blast</h2>
    <p>Pop the balloons with a quiver full of strange arrows.</p>
    <p><a href="https://danilofiocco.github.io/balloonGame/">Play in your browser</a> ·
      <a href="https://danilofiocco.github.io/balloonGame/privacy.html">Privacy policy</a></p>
  </div>
</main>
</body>
</html>
